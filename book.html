
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Slot</title>
  <link rel="stylesheet" href="styles.css"> <!-- Add your CSS here -->
</head>
<body>
  <div style="padding: 20px;">
    <h1>Book Your Slot</h1>
    <form id="bookingForm" action="/book" method="POST">
      <div>
        <label for="name">Your Name:</label>
        <input type="text" id="name" name="name" required>
      </div>
      <div>
        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" required>
      </div>
      <div>
        <label for="datetime">Preferred Date & Time:</label>
        <input type="datetime-local" id="datetime" name="datetime" required>
      </div>
      <input type="hidden" id="stationName" name="station_name">
      <input type="hidden" id="stationAddress" name="address">
      <input type="hidden" id="stationLat" name="lat">
      <input type="hidden" id="stationLon" name="lon">
      <button type="submit">Book Slot</button>
    </form>
  </div>

  <script>
    // Get URL parameters and fill the form
    const urlParams = new URLSearchParams(window.location.search);
    document.getElementById("stationName").value = urlParams.get("name");
    document.getElementById("stationAddress").value = urlParams.get("address");
    document.getElementById("stationLat").value = urlParams.get("lat");
    document.getElementById("stationLon").value = urlParams.get("lon");
  </script>
</body>
</html>
